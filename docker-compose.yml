services:
  postgres:
    image: postgres:17-alpine
    container_name: legal-bench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_bench
      POSTGRES_USER: legal_bench
      POSTGRES_PASSWORD: legal_bench_dev_password
    ports:
      - "5432:5432"
    volumes:
      - legal_bench_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_bench -d legal_bench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  legal_bench_postgres_data:
